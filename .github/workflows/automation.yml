
name: E-Commerce Automation Suite

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ecommerce-automation
  cancel-in-progress: false

jobs:

  automation-tests:

    runs-on: ubuntu-24.04

    timeout-minutes: 30

    steps:

      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify environment
        run: |
          java -version
          mvn -version
          google-chrome --version
          "$CHROMEWEBDRIVER/chromedriver" --version

      - name: Execute UI and API automation tests
        run: |
          mvn -B clean test \
            -Dbrowser=chrome \
            -Dheadless=true \
            -DblockAds=true \
            "-Dwebdriver.chrome.driver=$CHROMEWEBDRIVER/chromedriver"

      - name: Generate Allure report
        if: always() && hashFiles('target/allure-results/*-result.json') != ''
        run: mvn -B allure:report

      - name: Upload automation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: automation-test-reports
          path: |
            target/surefire-reports/
            target/allure-results/
            target/site/
            target/screenshots/
          retention-days: 14
          if-no-files-found: warn
